[project]
name = "nio-skill-backend-desk"
version = "0.1.0"
description = "Camada NOOA da desk backend-desk — agregador de perfil (cascata de skills)."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "nooa @ git+https://github.com/NVIDIA-NeMo/labs-OO-Agents.git@v0.0.7",
]

[project.entry-points."nooa.skills"]
"nio.backend-desk" = "nio_skill_backend_desk:BackendDeskSkill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nio_skill_backend_desk"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
